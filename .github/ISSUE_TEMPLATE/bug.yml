name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include package/runtime versions, platform, and steps. Remove keys, credentials, cookies and personal data.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error codes and logs
